[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agroscan"
version = "0.1.0"
description = "AI-Powered Semi-Automated Multi-Category Goods Inspection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.12.0",
]

[project.scripts]
agroscan = "agroscan.main:main"

[tool.setuptools.packages.find]
where = ["src"]
